<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - TP Final</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <!-- Pestañas para alternar entre Login y Registro -->
        <div class="auth-tabs">
            <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
            <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Registrarse</button>
        </div>

        <!-- Formulario de Login -->
        <form id="form-login" class="auth-form active">
            <h2>Bienvenido</h2>
            <div class="input-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" required placeholder="tu@email.com">
            </div>
            <div class="input-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn">Entrar</button>
        </form>

        <!-- Formulario de Registro (Acordeón / Solapa) -->
        <form id="form-register" class="auth-form">
            <h2>Crear Cuenta</h2>
            <div class="input-group">
                <label for="register-name">Nombre</label>
                <input type="text" id="register-name" required placeholder="Tu Nombre">
            </div>
            <div class="input-group">
                <label for="register-email">Correo Electrónico</label>
                <input type="email" id="register-email" required placeholder="tu@email.com">
            </div>
            <div class="input-group">
                <label for="register-password">Contraseña</label>
                <input type="password" id="register-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn">Registrarse</button>
        </form>

        <div id="mensaje-respuesta" class="mensaje"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
